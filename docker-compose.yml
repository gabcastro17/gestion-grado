
services:
  mysql:
    image: mysql:8.4
    container_name: gestion_grado_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root12345
      MYSQL_DATABASE: gestion_grado
      MYSQL_USER: gestion_user
      MYSQL_PASSWORD: gestion12345

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
